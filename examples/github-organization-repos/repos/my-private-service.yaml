my-private-service:
  description: "Internal payments microservice"
  visibility: private
  has_issues: true
  has_discussions: false
  has_projects: false
  has_wiki: false
  auto_init: true
  allow_merge_commit: true
  allow_squash_merge: true
  allow_rebase_merge: false
